name: Android Debug CI

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CI: true
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      NDK_VERSION: 27.1.12297006
      COMPILE_SDK: 36
      BUILD_TOOLS_VERSION: 36.0.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${COMPILE_SDK}" \
            "build-tools;${BUILD_TOOLS_VERSION}" \
            "ndk;${NDK_VERSION}"

      - name: Verify NDK installation
        shell: bash
        run: |
          set -euo pipefail
          NDK_DIR="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"
          test -f "${NDK_DIR}/source.properties"
          grep -q "Pkg.Revision = ${NDK_VERSION}" "${NDK_DIR}/source.properties"

      - name: TypeScript typecheck
        shell: bash
        run: npx tsc --noEmit

      - name: Run Jest tests
        shell: bash
        run: npm test -- --runInBand

      - name: Make Gradle wrapper executable
        shell: bash
        working-directory: android
        run: chmod +x ./gradlew

      - name: Run Android unit tests
        shell: bash
        working-directory: android
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        shell: bash
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate debug APK
        id: find_apk
        shell: bash
        working-directory: android
        run: |
          set -euo pipefail
          APK_PATH="$(find app/build/outputs -type f -name '*.apk' | sort | head -n 1)"
          if [ -z "${APK_PATH}" ]; then
            echo "No APK produced by assembleDebug."
            exit 1
          fi
          echo "apk_path=${APK_PATH}" >> "${GITHUB_OUTPUT}"
          ls -lh "${APK_PATH}"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-app-lock-hide-debug-apk
          path: android/${{ steps.find_apk.outputs.apk_path }}
